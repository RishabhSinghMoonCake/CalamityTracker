services:
  mongodb:
    image: mongo:7.0
    container_name: calamity-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - calamity-network

  redis:
    image: redis:7.2-alpine
    container_name: calamity-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - calamity-network

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: calamity-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/calamitytracker
      - MONGODB_KEY=mongodb://mongodb:27017/calamitytracker
      - REDIS_URL=redis://redis:6379
      - PIPELINE_AUTOMATION_ENABLED=false
      - NODE_ENV=production
      - TRUST_PROXY=true
    env_file:
      - ./Backend/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - calamity-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: calamity-worker
    restart: unless-stopped
    command: ["node", "workers/worker.js"]
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/calamitytracker
      - MONGODB_KEY=mongodb://mongodb:27017/calamitytracker
      - REDIS_URL=redis://redis:6379
      - PIPELINE_AUTOMATION_ENABLED=true
      - NODE_ENV=production
    env_file:
      - ./Backend/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - calamity-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: calamity-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - calamity-network

volumes:
  mongo_data:
  redis_data:

networks:
  calamity-network:
    driver: bridge
